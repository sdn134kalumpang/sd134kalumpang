<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Dokumen - SDN 134 Kalumpang</title>
<link rel="stylesheet" href="/sd134kalumpang/css/admin-elegant-final.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo"><div class="logo-icon">134</div><div class="logo-text">SDN 134<span>KALUMPANG</span></div></div></div>
  <nav class="sidebar-nav" id="dynamicSidebar"></nav>
  <div class="sidebar-footer"><p>NPSN 40312947<br>E-Dokumen - Firestore Only - Owner Only</p></div>
</aside>
<main class="main">
  <header class="topbar"><div class="breadcrumb"><span>E-Dokumen</span> / <strong id="breadcrumbFitur">Arsip</strong></div><div id="firestoreStatus" style="font-size:10px;padding:6px 10px;background:#fef9c3;border-radius:12px;margin-left:10px;">🔥 Connecting...</div></header>
  <div class="content" id="mainContent">Memuat arsip...</div>
</main>
<script src="/sd134kalumpang/js/config/service-menu.js"></script>
<script src="/sd134kalumpang/js/admin-elegant.js"></script>
<script type="module" src="/sd134kalumpang/js/config/firebase-config.js"></script>
<script type="module" src="/sd134kalumpang/js/config/firebase-service.js"></script>
<script src="/sd134kalumpang/modules/e-dokumen/main.js"></script>
<script type="module">
  window.addEventListener('firebase-ready', (e)=>{
    const el=document.getElementById('firestoreStatus');
    if(el){ el.textContent=`🔥 Connected: ${e.detail.projectId} - DB OK`; el.style.background='#dcfce7'; }
  });
  setTimeout(()=>{
    const el=document.getElementById('firestoreStatus');
    const d=window.db;
    if(el && d && window.FirebaseService && FirebaseService.isEnabled()){
      el.textContent='🔥 Connected + Service Ready - schools/40312947/e_dokumen_arsip';
      el.style.background='#dcfce7';
    } else if(el){
      el.textContent='⚠️ Cek Rules - schools/40312947 harus allow read,write if true';
      el.style.background='#fef2f2';
    }
  },2500);
  window.addEventListener('firebase-service-ready', ()=>{
    const el=document.getElementById('firestoreStatus');
    if(el) el.textContent='🔥 Connected + Service Ready - schools/40312947/e_dokumen_arsip';
  });
</script>
</body>
</html>
