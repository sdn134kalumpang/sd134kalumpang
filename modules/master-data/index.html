<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Data - SDN 134 Kalumpang</title>
<link rel="stylesheet" href="/sd134kalumpang/css/admin-elegant-final.css">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header"><div class="logo"><div class="logo-icon">134</div><div class="logo-text">SDN 134<span>KALUMPANG</span></div></div></div>
  <nav class="sidebar-nav" id="dynamicSidebar"></nav>
  <div class="sidebar-footer"><p>NPSN 40312947<br>Firebase - 1 File Multi Fungsi</p></div>
</aside>
<main class="main">
  <header class="topbar"><div class="breadcrumb"><span>Master Data</span> / <strong id="breadcrumbFitur">Kop</strong></div><div id="firestoreStatus" style="font-size:10px;padding:6px 10px;background:#fef9c3;border-radius:12px;margin-left:10px;">🔥 Connecting...</div></header>
  <div class="content" id="mainContent">Memuat...</div>
</main>
<!-- LOAD ORDER FIX: service-menu dulu (non-module), baru firebase (module) -->
<script src="/sd134kalumpang/js/config/service-menu.js"></script>
<script src="/sd134kalumpang/js/admin-elegant.js"></script>
<script type="module" src="/sd134kalumpang/js/config/firebase-config.js"></script>
<script type="module" src="/sd134kalumpang/js/config/firebase-service.js"></script>
<script src="/sd134kalumpang/modules/master-data/main.js"></script>
<script type="module">
  import { db } from '/sd134kalumpang/js/config/firebase-config.js';
  // Tunggu firebase-ready
  window.addEventListener('firebase-ready', (e)=>{
    const el = document.getElementById('firestoreStatus');
    if(el){
      el.textContent = `🔥 Connected: ${e.detail.projectId} - DB OK`;
      el.style.background = '#dcfce7';
      el.style.color = '#166534';
    }
    console.log('Firebase ready event:', e.detail);
  });
  setTimeout(()=>{
    const el = document.getElementById('firestoreStatus');
    const d = window.db;
    if(el && d){
      el.textContent = '🔥 Connected (sdn134kalumpang) - schools/40312947';
      el.style.background = '#dcfce7';
    } else if(el){
      el.textContent = '⚠️ Firestore offline - cek console (F12) untuk error 404/Rules';
      el.style.background = '#fef2f2';
      el.style.color = '#dc2626';
    }
  }, 2000);
  window.addEventListener('firebase-service-ready', ()=>{
    const el = document.getElementById('firestoreStatus');
    if(el) el.textContent = '🔥 Connected + Service Ready - schools/40312947/peserta_didik';
  });
</script>
</body>
</html>
