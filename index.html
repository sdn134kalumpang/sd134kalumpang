<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SDN 134 KALUMPANG</title>
<link rel="stylesheet" href="./css/main.css">
<link rel="stylesheet" href="./css/login.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo-icon-large">134</div>
        <h1>SDN 134 KALUMPANG</h1>
        <p>Tritiro, Bontotiro - Kab. Bulukumba<br>NPSN 40312947 • Akreditasi B</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label>Alamat Email</label>
          <input type="email" id="email" class="form-input" placeholder="admin@sdn134kalumpang.sch.id" required autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <div class="form-options">
          <label class="checkbox"><input type="checkbox" id="remember"> Ingat saya</label>
          <a href="#" class="link-small">Lupa password?</a>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">
          <span id="btnText">Sign In</span>
          <span id="btnLoader" style="display:none;">⏳ Memeriksa...</span>
        </button>

        <p id="loginError" class="error-text"></p>
        <p id="loginSuccess" class="success-text"></p>

        <div class="login-footer">
          <small>Operator: Muh Arfah Wahlil Pratama<br>sd134kalumpangcity@gmail.com • 48 Siswa • 9 Guru</small>
        </div>
      </form>
    </div>
  </div>

  <!-- Firebase Config buatan kamu -->
  <script type="module" src="./js/firebase-config.js"></script>
  <!-- Logic Login -->
  <script type="module" src="./js/login.js"></script>
</body>
</html>
